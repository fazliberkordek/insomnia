<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" aria-labelledby="la-title la-desc" role="img" viewBox="0 0 1000 460"><title id="la-title">Insomnia lid actions during a session</title><desc id="la-desc">A simplified three-column diagram. Left, an illustrated Settings excerpt titled Lid-close actions: the freeze list contains Slack, WhatsApp and Discord; Pause idle Docker is off; Mute audio is on. Arrows lead to the middle column, Lid closes: freeze selected apps, pause idle Docker, mute if enabled. Docker is paused only if the rule is on and two checks, the second right before the pause, find no containers running; a container that is still starting can slip past the second check. Muting saves your volume first. An arrow leads to the right column, Lid opens: try to restore, session continues. Insomnia resumes only the freezes it can verify it made, resumes Docker only if this rule paused it, and restores the saved volume. The timer never stopped; only its on-screen redraw paused. This repeats every time the lid closes and opens. Without an active session the lid does nothing. The Settings panel is a simplified illustration, not a screenshot.</desc><style>svg{font-family:-apple-system,BlinkMacSystemFont,&quot;SF Pro Text&quot;,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif}.bg{fill:#f3f2ef}.panel{fill:#faf9f6}.panel,.sep{stroke:#dbd9d4;stroke-width:1.5}.t{fill:#292d30}.m{fill:#5f6467}.a{fill:#536d78}.ic{fill:none;stroke-linecap:round;stroke-linejoin:round}.ln{stroke:#536d78;stroke-width:2.5}.ln,.mark-line{fill:none;stroke-linecap:round;stroke-linejoin:round}.ic,.mark-line{stroke:#292d30;stroke-width:2}.mark-line{stroke-width:1.5}.mark-fill{fill:#292d30}.knob{fill:#fff}.on{fill:#536d78}.off{fill:#c9c8c3}.remove{fill:#9a9c9e}.minus{fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round}@media (prefers-color-scheme:dark){.bg{fill:#242628}.panel{fill:#303336}.panel,.sep{stroke:#3e4145}.t{fill:#e6e3dd}.m{fill:#b5b7b8}.a{fill:#a6bbc3}.ln{stroke:#a6bbc3}.ic,.mark-line{stroke:#e6e3dd}.mark-fill{fill:#e6e3dd}.on{fill:#a6bbc3}.off{fill:#45494d}.remove{fill:#7a7d80}}</style><defs><g id="la-mark-closed"><path d="M1.5 12 C7 4.5 17 4.5 22.5 12 C17 19.5 7 19.5 1.5 12 Z" class="mark-fill"/><path d="M1.5 12 C7 4.5 17 4.5 22.5 12 C17 19.5 7 19.5 1.5 12 Z" class="mark-line"/><path d="M4.5499 17.8023 L3.1442 20.1659 M8.2636 19.3782 L7.5468 22.0332 M12 19.875 L12 22.625 M15.7364 19.3782 L16.4532 22.0332 M19.4501 17.8023 L20.8558 20.1659" class="mark-line"/></g><g id="la-mark-open"><path d="M1.5 12 C7 4.5 17 4.5 22.5 12 C17 19.5 7 19.5 1.5 12 Z" class="mark-line"/><path d="M15.3953 9.8853 A4 4 0 1 1 14.1147 8.6047 A1.4 1.4 0 1 0 15.3953 9.8853 Z" class="mark-fill"/><path d="M4.5499 6.1977 L3.1442 3.8341 M8.2636 4.6218 L7.5468 1.9668 M12 4.125 L12 1.375 M15.7364 4.6218 L16.4532 1.9668 M19.4501 6.1977 L20.8558 3.8341" class="mark-line"/></g><marker id="la-arrow" markerHeight="14" markerUnits="userSpaceOnUse" markerWidth="14" orient="auto" refX="11" refY="7" viewBox="0 0 14 14"><path d="M2 2 L12 7 L2 12 Z" class="a"/></marker></defs><rect width="1000" height="460" x="0" y="0" class="bg" rx="24"/><g transform="translate(32 20) scale(1.6667)"><use href="#la-mark-open"/></g><text x="88" y="50" class="t" font-size="26" font-weight="700">What the lid does during a session</text><g><rect width="300" height="300" x="32" y="80" class="panel" rx="16"/><text x="52" y="114" class="t" font-size="20" font-weight="700">Lid-close actions</text><text x="52" y="158" class="t" font-size="19">Slack</text><circle cx="302" cy="152" r="10" class="remove"/><path d="M296 152 H308" class="minus"/><text x="52" y="192" class="t" font-size="19">WhatsApp</text><circle cx="302" cy="186" r="10" class="remove"/><path d="M296 186 H308" class="minus"/><text x="52" y="226" class="t" font-size="19">Discord</text><circle cx="302" cy="220" r="10" class="remove"/><path d="M296 220 H308" class="minus"/><path d="M52 250 H312" class="sep"/><text x="52" y="290" class="t" font-size="19">Pause idle Docker</text><rect width="52" height="30" x="260" y="268" class="off" rx="15"/><circle cx="275" cy="283" r="12" class="knob"/><text x="52" y="348" class="t" font-size="19">Mute audio</text><rect width="52" height="30" x="260" y="326" class="on" rx="15"/><circle cx="297" cy="341" r="12" class="knob"/></g><text x="32" y="406" class="m" font-size="17">Simplified Settings</text><path marker-end="url(#la-arrow)" d="M340 186 H366" class="ln"/><path marker-end="url(#la-arrow)" d="M340 283 H366" class="ln"/><path marker-end="url(#la-arrow)" d="M340 341 H366" class="ln"/><g><rect width="290" height="300" x="372" y="80" class="panel" rx="16"/><g class="ic" transform="translate(392 96)"><rect width="36" height="8" x="2" y="16" rx="3"/><path d="M8 11 H32"/></g><text x="444" y="120" class="t" font-size="22" font-weight="700">Lid closes</text><text x="392" y="193" class="t" font-size="20" font-weight="600">Freeze selected apps</text><text x="392" y="290" class="t" font-size="20" font-weight="600">Pause idle Docker</text><text x="392" y="348" class="t" font-size="20" font-weight="600">Mute if enabled</text></g><path marker-end="url(#la-arrow)" d="M670 230 H696" class="ln"/><g><rect width="266" height="300" x="702" y="80" class="panel" rx="16"/><g class="ic" transform="translate(722 96)"><rect width="24" height="17" x="8" y="2" rx="3"/><rect width="36" height="6" x="2" y="22" rx="3"/></g><text x="774" y="120" class="t" font-size="22" font-weight="700">Lid opens</text><text x="722" y="193" class="t" font-size="20" font-weight="600">Try to restore</text><text x="722" y="290" class="t" font-size="20" font-weight="600">Session continues</text></g><g class="ic"><circle cx="44" cy="436" r="10"/><path d="M44 431 V436 H48.5"/></g><text x="64" y="442" class="m" font-size="19">Active sessions only. Timer keeps running.</text></svg>