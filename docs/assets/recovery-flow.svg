<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" aria-labelledby="rf-title rf-desc" role="img" viewBox="0 0 1000 420"><title id="rf-title">Insomnia recovery flow</title><desc id="rf-desc">A simplified diagram of two paths that converge. App cleanup runs at the end of a session or when the app reopens. A separate backup check runs every 60 seconds and leaves a valid, unexpired session alone. Both converge on one step: try to restore verified changes. Only changes that can be verified are undone; failed or unreadable evidence is kept rather than treated as clean. Below that, a warning: may need your attention. Two things can need it: saved audio is restored only by reopening the app, and an unconfirmed freeze means you should inspect the process yourself. The backup check undoes recorded changes only. It is not battery or thermal monitoring and cannot restore audio. On the left, an illustrated example of the right-click menu while cleanup is still pending shows a warning line reading Sleep still held with no session, a status line, then Settings and Quit Insomnia. It is an illustration, not a screenshot.</desc><style>svg{font-family:-apple-system,BlinkMacSystemFont,&quot;SF Pro Text&quot;,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif}.bg{fill:#f3f2ef}.panel{fill:#faf9f6;stroke:#dbd9d4}.menu,.panel,.sep{stroke-width:1.5}.menu{fill:#f7f6f3;stroke:#cfcdc8}.sep{stroke:#dbd9d4}.t{fill:#292d30}.m{fill:#5f6467}.a{fill:#536d78}.ic{fill:none;stroke-linecap:round;stroke-linejoin:round}.ln{stroke:#536d78;stroke-width:2.5}.ln,.mark-line{fill:none;stroke-linecap:round;stroke-linejoin:round}.ic,.mark-line{stroke:#292d30;stroke-width:2}.mark-line{stroke-width:1.5}.mark-fill{fill:#292d30}.warn{fill:#a85a00}.warn-ic{fill:none;stroke:#a85a00;stroke-width:2.25;stroke-linecap:round;stroke-linejoin:round}@media (prefers-color-scheme:dark){.bg{fill:#242628}.panel{fill:#303336;stroke:#3e4145}.menu{fill:#383b3f}.menu,.sep{stroke:#4a4d51}.t{fill:#e6e3dd}.m{fill:#b5b7b8}.a{fill:#a6bbc3}.ln{stroke:#a6bbc3}.ic,.mark-line{stroke:#e6e3dd}.mark-fill{fill:#e6e3dd}.warn{fill:#f2a854}.warn-ic{stroke:#f2a854}}</style><defs><g id="rf-mark-closed"><path d="M1.5 12 C7 4.5 17 4.5 22.5 12 C17 19.5 7 19.5 1.5 12 Z" class="mark-fill"/><path d="M1.5 12 C7 4.5 17 4.5 22.5 12 C17 19.5 7 19.5 1.5 12 Z" class="mark-line"/><path d="M4.5499 17.8023 L3.1442 20.1659 M8.2636 19.3782 L7.5468 22.0332 M12 19.875 L12 22.625 M15.7364 19.3782 L16.4532 22.0332 M19.4501 17.8023 L20.8558 20.1659" class="mark-line"/></g><g id="rf-mark-open"><path d="M1.5 12 C7 4.5 17 4.5 22.5 12 C17 19.5 7 19.5 1.5 12 Z" class="mark-line"/><path d="M15.3953 9.8853 A4 4 0 1 1 14.1147 8.6047 A1.4 1.4 0 1 0 15.3953 9.8853 Z" class="mark-fill"/><path d="M4.5499 6.1977 L3.1442 3.8341 M8.2636 4.6218 L7.5468 1.9668 M12 4.125 L12 1.375 M15.7364 4.6218 L16.4532 1.9668 M19.4501 6.1977 L20.8558 3.8341" class="mark-line"/></g><marker id="rf-arrow" markerHeight="14" markerUnits="userSpaceOnUse" markerWidth="14" orient="auto" refX="11" refY="7" viewBox="0 0 14 14"><path d="M2 2 L12 7 L2 12 Z" class="a"/></marker></defs><rect width="1000" height="420" x="0" y="0" class="bg" rx="24"/><g transform="translate(32 20) scale(1.6667)"><use href="#rf-mark-closed"/></g><text x="88" y="50" class="t" font-size="26" font-weight="700">Two ways back to normal</text><g><rect width="380" height="168" x="32" y="112" class="menu" rx="12"/><text x="52" y="146" class="warn" font-size="19">Sleep still held with no session</text><text x="52" y="176" class="m" font-size="19">Lid: open · 87%</text><path d="M44 192 H400" class="sep"/><text x="52" y="224" class="t" font-size="19">Settings…</text><text x="392" y="224" class="m" font-size="19" text-anchor="end">⌘,</text><text x="52" y="258" class="t" font-size="19">Quit Insomnia</text><text x="392" y="258" class="m" font-size="19" text-anchor="end">⌘Q</text></g><text x="32" y="310" class="m" font-size="17">Menu while cleanup is pending. Illustration.</text><g><rect width="250" height="120" x="452" y="80" class="panel" rx="16"/><g transform="translate(472 96) scale(1.3333)"><use href="#rf-mark-closed"/></g><text x="516" y="122" class="t" font-size="22" font-weight="700">App cleanup</text><text x="472" y="170" class="m" font-size="19">At end or reopen</text></g><g><rect width="250" height="120" x="718" y="80" class="panel" rx="16"/><g class="ic" transform="translate(738 98)"><circle cx="16" cy="16" r="13"/><path d="M16 8 V16 H22"/></g><text x="782" y="122" class="t" font-size="22" font-weight="700">Backup check</text><text x="738" y="170" class="m" font-size="19">Every 60 seconds</text></g><path d="M577 200 V224 H843 V200" class="ln"/><path marker-end="url(#rf-arrow)" d="M710 224 V244" class="ln"/><g><rect width="516" height="76" x="452" y="248" class="panel" rx="16"/><text x="710" y="294" class="t" font-size="22" font-weight="700" text-anchor="middle">Try to restore verified changes</text></g><path marker-end="url(#rf-arrow)" d="M710 324 V350" class="ln"/><g class="warn-ic"><path d="M567 362 L579 384 H555 Z"/><path d="M567 370 V377"/><path d="M567 380.5 V381"/></g><text x="590" y="382" class="warn" font-size="22" font-weight="700">May need your attention</text></svg>