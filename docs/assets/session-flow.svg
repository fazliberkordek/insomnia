<svg xmlns="http://www.w3.org/2000/svg" width="1130" height="170" aria-labelledby="sb-title sb-desc" role="img" viewBox="0 0 1130 170"><title id="sb-title">Insomnia session in the menu bar</title><desc id="sb-desc">Three menu bar snapshots side by side. Set a duration: clicking the closed eye shows three pills labelled Days, Hours and Minutes, with Hours focused. Watch the countdown: the eye opens, showing its pupil, and a live countdown of 3:59:41 ticks beside it, followed by a small x. Hold to end: pressing and holding the x fills a ring around it while the countdown reads 3:59:40.</desc><style>svg{font-family:-apple-system,BlinkMacSystemFont,&quot;SF Pro Text&quot;,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif}.bg{fill:#242628}.cap{fill:#e6e3dd}.bar,.mark-line{stroke:#fff;stroke-width:1.5}.bar{fill:#1e1f21;stroke-opacity:.08}.mark-line{fill:none;stroke-linecap:round;stroke-linejoin:round}.mark-fill{fill:#fff}.pill{fill:#17191b;fill-opacity:.92;stroke:#fff;stroke-opacity:.1;stroke-width:.9}.pill-ph{fill:#fff;fill-opacity:.42}.focus{fill:none;stroke:#a6bbc3;stroke-width:2.7}.count{fill:#fff}.prog,.track{fill:none;stroke-width:2.9}.x{fill:none}.track{stroke:#fff;stroke-opacity:.14}.prog,.x{stroke:#a6bbc3;stroke-linecap:round}.x{stroke:#fff;stroke-opacity:.85;stroke-width:2.6}</style><defs><g id="sb-mark-closed"><path d="M1.5 12 C7 4.5 17 4.5 22.5 12 C17 19.5 7 19.5 1.5 12 Z" class="mark-fill"/><path d="M1.5 12 C7 4.5 17 4.5 22.5 12 C17 19.5 7 19.5 1.5 12 Z" class="mark-line"/><path d="M4.5499 17.8023 L3.1442 20.1659 M8.2636 19.3782 L7.5468 22.0332 M12 19.875 L12 22.625 M15.7364 19.3782 L16.4532 22.0332 M19.4501 17.8023 L20.8558 20.1659" class="mark-line"/></g><g id="sb-mark-open"><path d="M1.5 12 C7 4.5 17 4.5 22.5 12 C17 19.5 7 19.5 1.5 12 Z" class="mark-line"/><path d="M15.3953 9.8853 A4 4 0 1 1 14.1147 8.6047 A1.4 1.4 0 1 0 15.3953 9.8853 Z" class="mark-fill"/><path d="M4.5499 6.1977 L3.1442 3.8341 M8.2636 4.6218 L7.5468 1.9668 M12 4.125 L12 1.375 M15.7364 4.6218 L16.4532 1.9668 M19.4501 6.1977 L20.8558 3.8341" class="mark-line"/></g></defs><rect width="1130" height="170" x="0" y="0" class="bg" rx="24"/><text x="270.5" y="50" class="cap" font-size="24" font-weight="600" text-anchor="middle">Set a duration</text><g transform="translate(28 72) scale(1.25)"><rect width="388" height="56" x="0" y="0" class="bar" rx="12"/><g transform="translate(14 12.7) scale(1.275)"><use href="#sb-mark-closed"/></g><rect width="80" height="34" x="62" y="11" class="pill" rx="12.6"/><text x="102" y="36" class="pill-ph" font-size="22" text-anchor="middle">Days</text><rect width="92" height="34" x="154" y="11" class="pill" rx="12.6"/><rect width="89.2" height="31.2" x="155.4" y="12.4" class="focus" rx="11.2"/><text x="200" y="36" class="pill-ph" font-size="22" text-anchor="middle">Hours</text><rect width="116" height="34" x="258" y="11" class="pill" rx="12.6"/><text x="316" y="36" class="pill-ph" font-size="22" text-anchor="middle">Minutes</text></g><text x="676.25" y="50" class="cap" font-size="24" font-weight="600" text-anchor="middle">Watch the countdown</text><g transform="translate(545 72) scale(1.25)"><rect width="210" height="56" x="0" y="0" class="bar" rx="12"/><g transform="translate(14 12.7) scale(1.275)"><use href="#sb-mark-open"/></g><text x="62" y="36" class="count" font-size="24" font-weight="500">3:59:41</text><g transform="translate(174 28)"><circle cx="0" cy="0" r="14.5" class="track"/><path d="M-4.5 -4.5 L4.5 4.5 M4.5 -4.5 L-4.5 4.5" class="x"/></g></g><text x="970.75" y="50" class="cap" font-size="24" font-weight="600" text-anchor="middle">Hold to end</text><g transform="translate(839.5 72) scale(1.25)"><rect width="210" height="56" x="0" y="0" class="bar" rx="12"/><g transform="translate(14 12.7) scale(1.275)"><use href="#sb-mark-open"/></g><text x="62" y="36" class="count" font-size="24" font-weight="500">3:59:40</text><g transform="translate(174 28) scale(1.12)"><circle cx="0" cy="0" r="14.5" class="track"/><path d="M0 -14.5 A14.5 14.5 0 1 1 -8.52 11.73" class="prog"/><path d="M-4.5 -4.5 L4.5 4.5 M4.5 -4.5 L-4.5 4.5" class="x"/></g></g></svg>